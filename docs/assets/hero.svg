  <path d="M1075 290C1116 290 1106 362 1154 362" fill="none" stroke="#efad8d" stroke-width="2" stroke-dasharray="5 5"/>
  <g transform="translate(1110 126)" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">
