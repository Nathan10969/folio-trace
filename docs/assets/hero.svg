  </g>
  <g transform="translate(1101 326)" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect width="149" height="84" rx="6" fill="#f3b29a"/>
    <rect width="5" height="84" fill="#cf6b52"/>
